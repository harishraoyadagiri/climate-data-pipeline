name: Climate Pipeline CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Run Tests
  # ─────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest tests/ -v --tb=short

  # ─────────────────────────────────────────────
  # Job 2: Lint & Format Check
  # ─────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: pip install flake8 black

      - name: Flake8 lint
        run: flake8 . --config=.flake8

      - name: Black format check
        run: black --check --diff .

  # ─────────────────────────────────────────────
  # Job 3: Docker Build
  # ─────────────────────────────────────────────
  docker:
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4

      - name: Build pipeline image
        run: docker build -t climate-pipeline:ci -f Dockerfile .

      - name: Build dashboard image
        run: docker build -t climate-dashboard:ci -f Dockerfile.dashboard .

      - name: Verify pipeline image
        run: docker run --rm climate-pipeline:ci --help

      - name: Verify dashboard image starts
        run: |
          docker run -d --name dash-test -p 8502:8502 climate-dashboard:ci
          sleep 5
          curl -f http://localhost:8502/_stcore/health || true
          docker stop dash-test
          docker rm dash-test

  # ─────────────────────────────────────────────
  # Job 4: dbt Model Check
  # ─────────────────────────────────────────────
  dbt:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install dbt-duckdb duckdb

      - name: Validate dbt project
        working-directory: dbt_project
        run: dbt debug --profiles-dir . --project-dir .

      - name: Compile dbt models
        working-directory: dbt_project
        run: dbt compile --profiles-dir . --project-dir .
